version: '3.7'

networks:
  sih_network:
    name: sih_network

services:

  ca-bel:
    image: hyperledger/fabric-ca:1.5.17
    container_name: ca-bel
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=BELCA
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - "7054:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw'
    volumes:
      - ../organizations/fabric-ca/bel:/etc/hyperledger/fabric-ca-server
    networks:
      - sih_network

  ca-auditor:
    image: hyperledger/fabric-ca:1.5.17
    container_name: ca-auditor
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=AuditorCA
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=8054
    ports:
      - "8054:8054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw'
    volumes:
      - ../organizations/fabric-ca/auditor:/etc/hyperledger/fabric-ca-server
    networks:
      - sih_network

  ca-contractor:
    image: hyperledger/fabric-ca:1.5.17
    container_name: ca-contractor
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ContractorCA
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=9054
    ports:
      - "9054:9054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw'
    volumes:
      - ../organizations/fabric-ca/contractor:/etc/hyperledger/fabric-ca-server
    networks:
      - sih_network

  ca-orderer:
    image: hyperledger/fabric-ca:1.5.17
    container_name: ca-orderer
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=OrdererCA
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=10054
    ports:
      - "10054:10054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw'
    volumes:
      - ../organizations/fabric-ca/orderer:/etc/hyperledger/fabric-ca-server
    networks:
      - sih_network
